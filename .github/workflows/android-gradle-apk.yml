name: Android APK (GitHub Gradle)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'app/**'
      - 'src/**'
      - 'assets/**'
      - '.github/workflows/android-gradle-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: '1'
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Android native project
        run: npx expo prebuild --platform android --clean

      - name: Build debug APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Stage and verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          mkdir -p artifacts
          cp "$APK" artifacts/EduMath-0.1.3-vc4-debug.apk
          sha256sum artifacts/EduMath-0.1.3-vc4-debug.apk
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          "$AAPT" dump badging artifacts/EduMath-0.1.3-vc4-debug.apk | grep -E "^(package:|application-label:)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EduMath-0.1.3-vc4-debug-apk
          path: artifacts/EduMath-0.1.3-vc4-debug.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
