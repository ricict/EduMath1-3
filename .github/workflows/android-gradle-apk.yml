name: Android Standalone APK (GitHub Gradle)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'app/**'
      - 'src/**'
      - 'assets/**'
      - '.github/workflows/android-gradle-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: '1'
      # Device-local diagnostic text in physical-test APK only; no telemetry.
      EXPO_PUBLIC_ENABLE_TEST_DIAGNOSTICS: '1'
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Android native project
        run: npx expo prebuild --platform android --clean

      # Release variant embeds Expo/React Native JavaScript; debug requires Metro.
      # The generated Expo Android template uses its debug keystore for local
      # release testing. This is NOT a production/Play Store signing workflow.
      - name: Build standalone release-variant APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Stage and verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          mkdir -p artifacts
          cp "$APK" artifacts/EduMath-0.1.3-vc4-standalone-test.apk
          sha256sum artifacts/EduMath-0.1.3-vc4-standalone-test.apk
          # Reject an APK without an embedded offline JS bundle.
          unzip -Z1 "$APK" | grep -Fx 'assets/index.android.bundle'
          echo "Embedded offline JavaScript bundle: PASS"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose "$APK"
          echo "Android APK signing verification: PASS"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          "$AAPT" dump badging artifacts/EduMath-0.1.3-vc4-standalone-test.apk | grep -E "^(package:|application-label:)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EduMath-0.1.3-vc4-standalone-test-apk
          path: artifacts/EduMath-0.1.3-vc4-standalone-test.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
