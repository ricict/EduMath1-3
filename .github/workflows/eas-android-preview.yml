# M8.2 rebuild: inline UX, grade advisory, no-repeat questions, answer reveal
# M8.2 rebuild: grade scoping, level gate, number-word answers
# M8.2 rebuild: Grade 1 practice variation/adaptive refresh
name: EAS Android Preview APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/eas-android-preview.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
          cache: 'npm'

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: 24.11.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Expo identity
        run: eas whoami

      - name: Build Android preview APK on EAS
        run: eas build --platform android --profile preview --non-interactive --wait --json
