name: Bootstrap package lock

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-package-lock.yml'

permissions:
  contents: write

# One-time M8 bootstrap used only to materialize the validated npm lockfile.
jobs:
  generate-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'

      - name: Generate package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Validate package lock
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Upload package lock
        uses: actions/upload-artifact@v6
        with:
          name: package-lock-bootstrap
          path: package-lock.json
          if-no-files-found: error

      - name: Commit validated package lock
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already current."
            exit 0
          fi
          git commit -m "build: lock npm dependency graph"
          git push origin HEAD:main
