name: Bootstrap EAS project

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-eas-project.yml'

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
          cache: 'npm'

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Expo identity
        run: eas whoami

      - name: Initialize EAS project
        run: eas init --force --non-interactive

      - name: Print EAS project ID
        run: node -e "console.log('EAS_PROJECT_ID=' + require('./app.json').expo.extra.eas.projectId)"

      - name: Validate preview Android config
        run: eas config --platform android --profile preview --json --non-interactive
